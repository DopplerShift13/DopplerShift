2026-10-06:
  444explorer:
  - rscadd: Added a 7 point upgrade to Counter-Resonance Anomaly; Ontologically Immutable,
      which silences everyone adjacent to you!
  TheOneAndOnlyCreeperJoe:
  - rscdel: Genemodded no longer lists any positive mutations, nor Stoner/Fiery Sweat
  - qol: Genemodded sorts mutations alphabetically now
  - bugfix: Genemodded has had several mutations removed that were causing CI/CD issues.
  - server: The blackbox now more in-depth tracks players spawning in with powers,
      alongside some side statistics such as species and assignment.
  - rscadd: Riftwalker now has variant-rifts with unique spawning behavior, e.g you
      can now find them in maintenance and more commonly around teleportation-structures!
  - rscadd: Science can now print rift goggles, which let them see riftwalker rifts
      and use equipment on it (though not go through rifts).
  - balance: Riftwalker no longer is affected by dispelling and anti-magic. Instead,
      it is disabled as anomalies are. Just like anomalies, it can drop a bluespace
      anomaly core (chance-based).
  - balance: Riftwalker spawns 2 extra pairs of rifts per round to offset the new
      diversity.
  - image: Riftwalker has new sprites!
  - sound: Adds a new sound to one of the rarer rift variants.
  carda-sometimesknownas-paxilmaniac:
  - rscadd: Adds the tetherspike, a handheld tool for moving heavy objects around
      safely.
  dawsonkeyes:
  - rscadd: Recolorable horned skull mask loadout item
  kannthus:
  - qol: adds dopplers own headshot URL
