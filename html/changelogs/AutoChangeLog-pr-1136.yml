author: "TheOneAndOnlyCreeperJoe"
delete-after: True
changes:
  - rscadd: "New UI for Powers that actually looks robust!"
  - rscadd: "Powers now have color defines; in essence consistent color associations. This is reflected in the UI and the action button colors."
  - rscadd: "Added Imbued under Resonant! It is now the home of Anomalous and Enchanted. Flavored around being inherently magical or supernatural, this category has a myriad of ways to interact with existing magic systems and act quirky at the same time."
  - rscadd: "Added Irregular under Mortal! It is now the home of False- and Hidden Power. The path is meant for niché powers that don't justify being secluded to a specific path. Irregular ignores the 2 path restriction"
  - rscadd: "Power names can now be migrated using a new global list without removing everyone's powers."
  - rscdel: "Powers can no longer be used when their user is in inside containers (mechs, closets, etc)."
  - balance: "Anomalous has been split away from Aberrant into the new Imbued path."
  - balance: "Deflect has less conservative upkeep and stamina costs."
  - balance: "Inexorable has been moved away from Quirks and into Aberrant (Monstrous). Costs 5 points."
  - balance: "Telekinesis can no longer levitate mechs."
  - balance: "Species with TRAIT_NOHUNGER (Hemophage, Holosynth) also get a 35% slower bleed-out rate with Monstrous Body to offset the fact that they do not regenerate blood."
  - refactor: "Backend middleware was improved for Powers, no longer sending unnecessary amounts of data."
  - code_imp: "Powers now store the type of magic they do which can be exploited by various other powers."
  - code_imp: "Power actions now inherit their antimagic flags from power's magic flags. Can still be overriden per usual."
  - bugfix: "Fixes the mental shielding implant to not consume quality when hit with magic that has 0 charge_cost"
  - bugfix: "Fixed a bug where the cultivator UI usurped the theologist UI if it was added after the theologist UI."
  - bugfix: "Reality Anchors now check off of archetype instead of path for moodlets, future-proofing them."
  - bugfix: "Deflect now only goes on cooldown after deactivation, not on activation. Respects the incapacitate var."
  - bugfix: "Prestidigitation is no longer unselected after use."
  - bugfix: "Martial Artist now lists its numerical value."
  - bugfix: "Riftwalker sometimes did not show rifts to a mob until they logged out and back in again."
  - bugfix: "Durathread robes now are properly included in the affinity file and thaumaturgic supplies."
  - bugfix: "Fixes a bug with Manipulate not nesting properly in the UI."
  - bugfix: "Fixes a bug with Hidden Powers not HIDING THE POWERS WTF- (it didn't hide powers that came after the Power was added)."